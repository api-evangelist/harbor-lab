aid: harbor-lab
name: Harbor Lab
description: Harbor Lab is an AI-powered port cost and disbursement account (DA) management
  platform for the maritime industry, headquartered in Athens, Greece. Its cloud software
  helps shipowners, ship managers, charterers, and port agents manage port calls, validate
  and approve disbursement accounts, benchmark and negotiate port service pricing across a
  marketplace of thousands of port service providers, and automate payment and settlement —
  improving operational efficiency, digitizing the process, and delivering cost transparency
  across port cost management. The company is backed by Speedinvest, VentureFriends, Atomico,
  and others. As of this profile Harbor Lab exposes a web dashboard product only; no public
  API, developer portal, or documentation surface was found.
